openapi: 3.1.0
info:
  title: OSCAR Gateway API
  version: "1.0.0"
  description: Confidential Agent Runtime Gateway API providing local PII masking, Zero Data Retention AI orchestration, and client-side AES-256-GCM envelope encryption.
  contact:
    name: OSCAR Core Engineering Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000
    description: Local development server

security:
  - OscarSessionKey: []

tags:
  - name: Memos
    description: Ingestion and processing of confidential memos with automatic PII sanitization and task extraction
  - name: Tasks
    description: Encrypted task persistence, lifecycle management, and metadata updates
  - name: System
    description: Operational health and diagnostic probes
  - name: Documentation
    description: OpenAPI specifications and interactive schema viewers

paths:
  /api/memos:
    post:
      tags:
        - Memos
      summary: Ingest and process memo
      description: Ingests raw memo text, masks PII using Priority Overlap Resolution, orchestrates Zero Data Retention inference with Gemini, re-hydrates tokens, envelope-encrypts sensitive fields with AES-256-GCM, and persists encrypted entities.
      operationId: ingestMemo
      requestBody:
        required: true
        description: Raw confidential memo text and optional title
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoInput'
      responses:
        '201':
          description: Memo successfully ingested, decomposed into structured tasks, envelope-encrypted, and stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMemoResponse'
        '400':
          description: Validation failure or malformed JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal server error (zero PII, zero stack trace leaked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'

  /api/tasks:
    get:
      tags:
        - Tasks
      summary: List encrypted tasks
      description: Retrieves all persisted tasks with AES-256-GCM ciphertext payloads. Queryable metadata (category, priority, status, tags) remains visible for indexing while sensitive titles, summaries, and subtasks remain strictly encrypted.
      operationId: listTasks
      responses:
        '200':
          description: List of stored encrypted task entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskEntity'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
    post:
      tags:
        - Tasks
      summary: Manually create task
      description: Manually creates a new task entity, envelope-encrypts sensitive cleartext using AES-256-GCM, and persists it into the store with default DRAFT status.
      operationId: createTask
      requestBody:
        required: true
        description: Task creation payload including title, summary, priority, and optional subtasks
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
      responses:
        '201':
          description: Task successfully created, envelope-encrypted, and stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEntity'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'

  /api/tasks/{id}:
    patch:
      tags:
        - Tasks
      summary: Update task status or metadata
      description: Updates task status, priority, category, scheduled date, tags, or modifies sensitive fields with client-key re-encryption.
      operationId: updateTask
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the task entity to update
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{20,36}$'
      requestBody:
        required: true
        description: Task fields to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInput'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEntity'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
    delete:
      tags:
        - Tasks
      summary: Delete task
      description: Permanently removes a task entity from the persistent store.
      operationId: deleteTask
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the task entity to remove
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{20,36}$'
      responses:
        '200':
          description: Task successfully removed
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - id
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: string
                    example: task_1731065600000_abc123
                  message:
                    type: string
                    example: Task successfully removed
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'

  /api/health:
    get:
      tags:
        - System
      summary: Health probe
      description: Evaluates operational readiness and gateway health status.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Gateway service is healthy and operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/docs/openapi.yaml:
    get:
      tags:
        - Documentation
      summary: Raw OpenAPI 3.1 specification
      description: Returns the raw OpenAPI 3.1 specification document in YAML format.
      operationId: getOpenApiYaml
      security: []
      responses:
        '200':
          description: Raw OpenAPI 3.1 specification in YAML format
          content:
            application/yaml:
              schema:
                type: string
            text/yaml:
              schema:
                type: string

  /api/docs:
    get:
      tags:
        - Documentation
      summary: Interactive API documentation viewer (HTML)
      description: Serves an interactive API explorer interface (e.g. Swagger UI or Redoc) for exploring and executing OSCAR Gateway endpoints.
      operationId: getDocsHtml
      security: []
      responses:
        '200':
          description: Interactive documentation HTML user interface
          content:
            text/html:
              schema:
                type: string

components:
  securitySchemes:
    OscarSessionKey:
      type: apiKey
      in: header
      name: X-Oscar-Encryption-Key
      description: 256-bit Base64 or Hex AES-GCM session key used for zero-knowledge envelope encryption and decryption across the API boundary.

  schemas:
    PIIType:
      type: string
      enum:
        - SECRET_KEY
        - IBAN
        - EMAIL
        - PHONE
        - AMOUNT_MONEY
        - PERSON
        - ADDRESS
        - HEALTH_DATA
        - NATIONAL_ID
      description: Categories of sensitive personally identifiable information detected by Privacy Guard

    RiskLevel:
      type: string
      enum:
        - NONE
        - LOW
        - MEDIUM
        - HIGH
      description: Calculated privacy risk level based on token count, density, and sensitivity

    TaskCategory:
      type: string
      enum:
        - WORK
        - INTERVIEW_PREP
        - FINANCE
        - PERSONAL
        - HEALTH
        - OTHER
      description: Predefined category taxonomy for task classification

    TaskPriority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - URGENT
      description: Priority level inferred from deadlines, tone, or manual assignment

    TaskStatus:
      type: string
      enum:
        - DRAFT
        - PENDING
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
      default: DRAFT
      description: Workflow state; defaults to DRAFT under EU AI Act human review principles

    AIProvenance:
      type: string
      enum:
        - GEMINI_FLASH
        - DETERMINISTIC_FALLBACK
      description: Origin engine of task extraction

    EncryptedPayload:
      type: object
      required:
        - ciphertext
        - iv
        - authTag
      properties:
        ciphertext:
          type: string
          minLength: 1
          description: Base64-encoded AES-256-GCM ciphertext
        iv:
          type: string
          minLength: 1
          description: Base64-encoded 96-bit (12-byte) initialization vector
        authTag:
          type: string
          minLength: 1
          description: Base64-encoded 128-bit authentication tag
        keyId:
          type: string
          default: v1
          description: Key derivation identifier for future key rotation
      description: Client-side AES-256-GCM envelope-encrypted payload

    PIITokenMap:
      type: object
      required:
        - token
        - type
        - originalValue
        - startIndex
        - endIndex
      properties:
        token:
          type: string
          pattern: '^\[[A-Z_]+_\d+\]$'
          description: Synthetic token identifier matching bracketed format, e.g. [EMAIL_0]
        type:
          $ref: '#/components/schemas/PIIType'
        originalValue:
          type: string
          minLength: 1
          description: Original raw sensitive value identified in text
        startIndex:
          type: integer
          minimum: 0
          description: 0-based character start index in source text
        endIndex:
          type: integer
          minimum: 1
          description: 0-based character end index in source text
      description: Ephemeral token substitution mapping for safe AI processing and post-rehydration

    MemoPIIStats:
      type: object
      required:
        - detectedEntityCount
        - maskedTokens
        - riskLevel
      properties:
        detectedEntityCount:
          type: integer
          minimum: 0
          description: Total number of sensitive PII tokens identified and masked
        maskedTokens:
          type: array
          items:
            $ref: '#/components/schemas/PIITokenMap'
          description: Ephemeral token replacement records
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
      description: Sanitization and privacy telemetry metrics

    SubtaskItem:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Concise, actionable subtask checklist item
        completed:
          type: boolean
          default: false
          description: Initial completion state, defaults to false
      description: Actionable checklist item decomposed from memo

    ExtractedTask:
      type: object
      required:
        - title
        - summary
        - category
        - priority
        - scheduledDate
        - tags
        - subtasks
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
          description: Action-oriented title summarizing the memo
        summary:
          type: string
          minLength: 5
          maxLength: 500
          description: Concise summary detailing core objective and context
        category:
          $ref: '#/components/schemas/TaskCategory'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        scheduledDate:
          type:
            - string
            - 'null'
          format: date-time
          description: Inferred deadline timestamp or null
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 30
          maxItems: 8
          description: Contextual tags
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/SubtaskItem'
          minItems: 1
          maxItems: 10
          description: Actionable decomposed subtasks
        location:
          type:
            - string
            - 'null'
          description: Extracted physical location, meeting venue, or city
        contactPerson:
          type:
            - string
            - 'null'
          description: Primary person of contact or counterparty
        amount:
          type:
            - string
            - 'null'
          description: Associated financial budget or invoice amount
        scheduledTime:
          type:
            - string
            - 'null'
          description: Colloquial or explicit time specification
      description: AI structured response output contract passed to Gemini responseSchema

    DecryptedTaskPayload:
      type: object
      required:
        - title
        - summary
        - subtasks
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 250
          description: Re-hydrated title accommodating token expansion beyond 120 chars
        summary:
          type: string
          minLength: 5
          maxLength: 1000
          description: Re-hydrated summary accommodating token expansion beyond 500 chars
        subtasks:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required:
              - title
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 400
                description: Subtask title with re-hydrated cleartext
              completed:
                type: boolean
                default: false
        location:
          type:
            - string
            - 'null'
          description: Extracted physical location, meeting venue, or city
        contactPerson:
          type:
            - string
            - 'null'
          description: Primary person of contact or counterparty
        amount:
          type:
            - string
            - 'null'
          description: Associated financial budget or invoice amount
        scheduledTime:
          type:
            - string
            - 'null'
          description: Colloquial or explicit time specification
      description: In-memory decrypted cleartext task payload with post-rehydration bounds expansion

    TaskEntity:
      type: object
      required:
        - id
        - memoId
        - userId
        - encryptedPayload
        - category
        - priority
        - status
        - scheduledDate
        - tags
        - provenance
        - modelVersion
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[a-zA-Z0-9_-]{20,36}$'
          description: Unique document identifier (UUIDv4 or Firestore ID)
        memoId:
          type: string
          pattern: '^[a-zA-Z0-9_-]{20,36}$'
          description: Foreign key reference linking to source MemoEntity
        userId:
          type: string
          pattern: '^[a-zA-Z0-9_-]{20,36}$'
          description: Owner user identifier
        encryptedPayload:
          $ref: '#/components/schemas/EncryptedPayload'
        category:
          $ref: '#/components/schemas/TaskCategory'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        status:
          $ref: '#/components/schemas/TaskStatus'
        scheduledDate:
          type:
            - string
            - 'null'
          format: date-time
          description: ISO 8601 scheduled date or null
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 30
          maxItems: 8
          description: Contextual index tags (sanitized)
        provenance:
          $ref: '#/components/schemas/AIProvenance'
        modelVersion:
          type: string
          minLength: 1
          description: Model or rule version identifier (e.g. gemini-2.5-flash-001 or fallback-v1)
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        scheduledTime:
          type:
            - string
            - 'null'
          description: Colloquial or explicit time specification
      description: Stored task entity with envelope-encrypted payload and non-PII metadata

    MemoEntity:
      type: object
      required:
        - id
        - userId
        - encryptedPayload
        - hasPII
        - maskedFieldsCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^[a-zA-Z0-9_-]{20,36}$'
          description: Unique document identifier (UUIDv4 or Firestore ID)
        userId:
          type: string
          pattern: '^[a-zA-Z0-9_-]{20,36}$'
          description: Owner user identifier
        encryptedPayload:
          $ref: '#/components/schemas/EncryptedPayload'
        sanitizedContentPreview:
          type: string
          description: Optional redacted preview (omitted at rest for zero plaintext PII)
        hasPII:
          type: boolean
          description: Flag indicating if any sensitive tokens were detected and masked
        maskedFieldsCount:
          type: integer
          minimum: 0
          description: Total number of masked tokens
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
      description: Stored memo entity with encrypted raw content and PII telemetry (no plaintext preview at rest)

    MemoInput:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: Raw user memo text for privacy masking and extraction
        title:
          type: string
          maxLength: 200
          description: Optional title for the memo
      description: Ingestion payload for memo processing and task decomposition

    CreateMemoResponse:
      type: object
      required:
        - task
        - tasks
        - memo
        - piiStats
      properties:
        task:
          $ref: '#/components/schemas/TaskEntity'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskEntity'
          description: Collection of created tasks
        memo:
          $ref: '#/components/schemas/MemoEntity'
        piiStats:
          $ref: '#/components/schemas/MemoPIIStats'
      description: Response payload containing created encrypted tasks, memo record, and privacy statistics

    CreateTaskInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 250
          description: Task title
        summary:
          type: string
          minLength: 5
          maxLength: 1000
          description: Summary detailing core objective and context
        category:
          $ref: '#/components/schemas/TaskCategory'
          default: OTHER
        priority:
          $ref: '#/components/schemas/TaskPriority'
          default: MEDIUM
        status:
          $ref: '#/components/schemas/TaskStatus'
          default: DRAFT
        scheduledDate:
          type:
            - string
            - 'null'
          format: date-time
          default: null
          description: ISO 8601 scheduled deadline or null
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 30
          maxItems: 8
          default: []
          description: Contextual tags
        subtasks:
          type: array
          items:
            type: object
            required:
              - title
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 400
                description: Subtask title
              completed:
                type: boolean
                default: false
                description: Subtask completion status
          maxItems: 10
          description: Actionable checklist subtask items
        location:
          type:
            - string
            - 'null'
          description: Extracted physical location, meeting venue, or city
        contactPerson:
          type:
            - string
            - 'null'
          description: Primary person of contact or counterparty
        amount:
          type:
            - string
            - 'null'
          description: Associated financial budget or invoice amount
        scheduledTime:
          type:
            - string
            - 'null'
          description: Colloquial or explicit time specification
      description: Input payload for manual task creation

    UpdateTaskInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 250
          description: Updated task title
        summary:
          type: string
          minLength: 5
          maxLength: 1000
          description: Updated task summary
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        category:
          $ref: '#/components/schemas/TaskCategory'
        scheduledDate:
          type:
            - string
            - 'null'
          format: date-time
          description: Updated scheduled deadline or null
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 30
          maxItems: 8
          description: Updated contextual tags
        subtasks:
          type: array
          items:
            type: object
            required:
              - title
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 400
                description: Subtask title
              completed:
                type: boolean
                default: false
                description: Subtask completion status
          maxItems: 10
          description: Updated checklist items
        location:
          type:
            - string
            - 'null'
          description: Extracted physical location, meeting venue, or city
        contactPerson:
          type:
            - string
            - 'null'
          description: Primary person of contact or counterparty
        amount:
          type:
            - string
            - 'null'
          description: Associated financial budget or invoice amount
        scheduledTime:
          type:
            - string
            - 'null'
          description: Colloquial or explicit time specification
      description: Input payload for updating task status or metadata

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
          description: Service health operational state
        timestamp:
          type: string
          format: date-time
          example: '2026-11-08T12:00:00.000Z'
          description: ISO 8601 evaluation timestamp
      description: System health probe response

    ValidationError:
      type: object
      required:
        - error
        - issues
      properties:
        error:
          type: string
          example: Validation failed
          description: High-level error summary
        issues:
          type: array
          items:
            type: object
            required:
              - path
              - message
              - code
            properties:
              path:
                type: string
                example: content
                description: Dot-separated path to the invalid field
              message:
                type: string
                example: Content must not be empty
                description: Human-readable validation failure description
              code:
                type: string
                example: too_small
                description: Validation error identifier
          description: Granular list of field-level schema validation errors
      description: Structured validation failure response

    ServerError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: Internal server error
          description: High-level error summary
        message:
          type: string
          example: An unexpected internal error occurred while processing the request
          description: Sanitized internal error description (zero PII, zero stack trace)
      description: Structured internal server error response

    NotFoundError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: Task not found
          description: High-level error summary
        message:
          type: string
          example: Task with id 'task_123456789' was not found
          description: Detailed explanation of missing resource
      description: Structured resource not found error response

    PrivacyAuditLog:
      type: object
      required:
        - id
        - userId
        - action
        - detectedTypes
        - tokenCount
        - riskLevel
        - durationMs
        - timestamp
      properties:
        id:
          type: string
          pattern: '^[a-zA-Z0-9_-]{20,36}$'
          description: Unique audit record identifier
        userId:
          type: string
          pattern: '^[a-zA-Z0-9_-]{20,36}$'
          description: Anonymized user reference
        action:
          type: string
          enum:
            - MASK_SUCCESS
            - UNMASK_SUCCESS
            - ENCRYPTION_SUCCESS
            - VALIDATION_FAILURE
            - FALLBACK_TRIGGERED
          description: Audited privacy engine action
        detectedTypes:
          type: array
          items:
            $ref: '#/components/schemas/PIIType'
          description: Categories of PII identified
        tokenCount:
          type: integer
          minimum: 0
          description: Number of sensitive items sanitized
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        durationMs:
          type: number
          minimum: 0
          description: Processing latency in milliseconds
        timestamp:
          type: string
          format: date-time
          description: Audit timestamp
      description: Zero-PII compliance audit log record

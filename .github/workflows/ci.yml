name: CI / Vitest Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Quality Gate, Lint & Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Server Install Dependencies
        run: cd server && npm ci

      - name: Server ESLint & Type Check
        run: cd server && npx tsc --noEmit && npm run lint

      - name: Server Vitest with Coverage
        run: cd server && npx vitest run --coverage

      - name: Client Install Dependencies
        run: cd client && npm ci

      - name: Client ESLint & Type Check
        run: cd client && npx tsc --noEmit && npm run lint

      - name: Client Vitest with Coverage
        run: cd client && npx vitest run --coverage

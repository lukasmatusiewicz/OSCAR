name: CI / Vitest Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Static Analysis & Lint Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Server Install, Build & Lint
        run: |
          npm --prefix server ci
          npm --prefix server run build
          npm --prefix server run lint

      - name: Client Install, Build & Lint
        run: |
          npm --prefix client ci
          npm --prefix client run build
          npm --prefix client run lint

  test-server:
    name: Server Vitest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Server Vitest Suite with Coverage
        run: |
          npm --prefix server ci
          npm --prefix server run test:coverage

  test-client:
    name: Client Vitest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Client Vitest Suite with Coverage
        run: |
          npm --prefix client ci
          npm --prefix client run test:coverage

  build-verification:
    name: Production Build Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Server Production Build
        run: |
          npm --prefix server ci
          npm --prefix server run build

      - name: Client Production Build
        run: |
          npm --prefix client ci
          npm --prefix client run build
